<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8" />
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%; background: #0a0a0b; color: #d6d6d9;
    font-family: -apple-system, 'Inter', sans-serif; font-size: 13px;
  }
  #app { display: flex; flex-direction: column; height: 100%; }

  header {
    flex: 0 0 auto; padding: 14px 16px 12px; border-bottom: 1px solid rgba(255,255,255,0.08);
  }
  .brand { font-family: 'Courier New', monospace; font-size: 9px; letter-spacing: 2px; color: #63636a; text-transform: uppercase; }
  .ai-name { font-size: 15px; font-weight: 600; color: #f0efec; margin-top: 3px; }
  .status-row { display: flex; align-items: center; gap: 6px; margin-top: 6px; }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: #63636a; flex: 0 0 auto; }
  .dot.online { background: #7fd99a; box-shadow: 0 0 5px rgba(127,217,154,0.6); }
  .status-text { font-size: 10.5px; color: #7a7a82; }
  .status-text.online { color: #7fd99a; }
  #disconnect-link { font-size: 10px; color: #63636a; cursor: pointer; margin-left: auto; text-decoration: underline; }
  #disconnect-link:hover { color: #9a9aa2; }

  #not-connected {
    flex: 1; display: none; align-items: center; justify-content: center; text-align: center;
    padding: 24px; color: #7a7a82; font-size: 12.5px; line-height: 1.6;
  }

  #messages { flex: 1; overflow-y: auto; padding: 14px 16px; display: flex; flex-direction: column; gap: 12px; }
  .msg { max-width: 92%; line-height: 1.55; font-size: 13px; white-space: pre-wrap; word-wrap: break-word; }
  .msg.user { align-self: flex-end; background: rgba(255,255,255,0.08); color: #f0efec; padding: 8px 11px; border-radius: 10px 10px 2px 10px; }
  .msg.assistant { align-self: flex-start; color: #d6d6d9; padding: 2px 2px; }
  .msg.error { align-self: flex-start; color: #e8432c; font-size: 11.5px; }
  .msg.pending { align-self: flex-start; color: #63636a; font-style: italic; font-size: 12px; }

  #empty-state { color: #63636a; font-size: 12px; text-align: center; margin-top: 30%; padding: 0 20px; line-height: 1.6; }

  #composer {
    flex: 0 0 auto; padding: 10px 12px; border-top: 1px solid rgba(255,255,255,0.08);
    display: flex; gap: 8px; align-items: flex-end;
  }
  #composer textarea {
    flex: 1; resize: none; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.14);
    border-radius: 8px; color: #f0efec; font-size: 13px; font-family: inherit; padding: 8px 10px;
    max-height: 100px; min-height: 36px; line-height: 1.4;
  }
  #composer textarea:focus { outline: none; border-color: rgba(127,217,154,0.5); }
  #composer textarea:disabled { opacity: 0.5; }
  #send-btn {
    flex: 0 0 auto; background: rgba(127,217,154,0.12); color: #7fd99a; border: none;
    width: 36px; height: 36px; border-radius: 8px; cursor: pointer; font-size: 15px;
    transition: background 0.15s ease;
  }
  #send-btn:hover { background: rgba(127,217,154,0.2); }
  #send-btn:disabled { opacity: 0.4; cursor: default; }
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="brand">NEUROVANCE</div>
    <div class="ai-name" id="ai-name">Superself</div>
    <div class="status-row">
      <div class="dot" id="status-dot"></div>
      <div class="status-text" id="status-text">Checking…</div>
      <div id="disconnect-link">Disconnect</div>
    </div>
  </header>

  <div id="not-connected">
    Not connected yet.<br /><br />Click the Neurovance icon in your toolbar to pair this browser.
  </div>

  <div id="messages">
    <div id="empty-state">Ask it to look something up, open a page, or act on the tab you're on.</div>
  </div>

  <div id="composer">
    <textarea id="input" placeholder="Message your Superself…" rows="1"></textarea>
    <button id="send-btn">&#8593;</button>
  </div>
</div>
<script src="sidepanel.js"></script>
</body>
</html>
