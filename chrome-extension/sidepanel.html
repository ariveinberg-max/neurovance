<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8" />
<style>
  :root {
    --bg: #0a0a0c;
    --surface: #121216;
    --surface-alt: #18181e;
    --text-bright: #fefefe;
    --text-primary: #d6d6d9;
    --text-secondary: #a1a1aa;
    --text-muted: #71717a;
    --text-faint: #52525b;
    --accent-green: #a3e6b5;
    --accent-red: #ff5f45;
    --overlay-rgb: 255, 255, 255;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%; background: var(--bg); color: var(--text-primary);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 13px;
  }
  #app { display: flex; flex-direction: column; height: 100%; }

  header {
    flex: 0 0 auto; padding: 20px 16px 16px; border-bottom: 1px solid rgba(var(--overlay-rgb), 0.06);
    background: linear-gradient(to bottom, var(--surface), var(--bg));
  }
  .brand { font-family: 'Courier New', monospace; font-size: 9px; letter-spacing: 2px; color: var(--text-faint); text-transform: uppercase; }
  .ai-name { font-size: 16px; font-weight: 600; color: var(--text-bright); margin-top: 4px; letter-spacing: 0.5px; }
  .status-row { display: flex; align-items: center; gap: 8px; margin-top: 8px; }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--text-faint); flex: 0 0 auto; }
  .dot.online { background: var(--accent-green); box-shadow: 0 0 6px rgba(163,230,181,0.5); }
  .status-text { font-size: 11px; color: var(--text-muted); font-family: 'Courier New', monospace; }
  .status-text.online { color: var(--accent-green); }
  #disconnect-link { font-size: 10px; color: var(--text-faint); cursor: pointer; margin-left: auto; text-decoration: underline; transition: color 0.2s ease; }
  #disconnect-link:hover { color: var(--text-secondary); }

  #not-connected {
    flex: 1; display: none; align-items: center; justify-content: center; text-align: center;
    padding: 32px; color: var(--text-secondary); font-size: 13px; line-height: 1.6;
  }

  #messages { flex: 1; overflow-y: auto; padding: 20px 16px; display: flex; flex-direction: column; gap: 14px; }
  .msg { max-width: 90%; line-height: 1.6; font-size: 13px; white-space: pre-wrap; word-wrap: break-word; padding: 10px 14px; border-radius: 14px; }
  .msg.user { align-self: flex-end; background: rgba(var(--overlay-rgb), 0.06); color: var(--text-bright); border: 1px solid rgba(var(--overlay-rgb), 0.08); border-bottom-right-radius: 4px; }
  .msg.assistant { align-self: flex-start; color: var(--text-primary); background: rgba(var(--overlay-rgb), 0.03); border: 1px solid rgba(var(--overlay-rgb), 0.05); border-bottom-left-radius: 4px; }
  .msg.error { align-self: flex-start; color: var(--accent-red); font-size: 12px; background: none; border: none; }
  .msg.pending { align-self: flex-start; color: var(--text-muted); font-style: italic; font-size: 12px; background: none; border: none; }

  #empty-state { color: var(--text-faint); font-size: 12px; text-align: center; margin-top: 30%; padding: 0 24px; line-height: 1.7; }

  #composer {
    flex: 0 0 auto; padding: 16px; border-top: 1px solid rgba(var(--overlay-rgb), 0.06);
    display: flex; gap: 10px; align-items: flex-end; background: var(--bg);
  }
  #composer textarea {
    flex: 1; resize: none; background: rgba(var(--overlay-rgb), 0.05); border: 1px solid rgba(var(--overlay-rgb), 0.12);
    border-radius: 10px; color: var(--text-bright); font-size: 13px; font-family: inherit; padding: 10px 12px;
    max-height: 120px; min-height: 38px; line-height: 1.4; outline: none; transition: all 0.2s ease;
  }
  #composer textarea:focus { outline: none; border-color: rgba(163,230,181,0.4); background: rgba(var(--overlay-rgb), 0.08); }
  #composer textarea:disabled { opacity: 0.5; }
  #send-btn {
    flex: 0 0 auto; background: rgba(163,230,181,0.15); color: var(--accent-green); border: 1px solid rgba(163,230,181,0.2);
    width: 38px; height: 38px; border-radius: 10px; cursor: pointer; font-size: 16px;
    transition: all 0.2s ease; display: flex; align-items: center; justify-content: center;
  }
  #send-btn:hover { background: rgba(163,230,181,0.25); color: var(--text-bright); }
  #send-btn:disabled { opacity: 0.4; cursor: default; }
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="brand">NEUROVANCE</div>
    <div class="ai-name" id="ai-name">Superself</div>
    <div class="status-row">
      <div class="dot" id="status-dot"></div>
      <div class="status-text" id="status-text">Checking…</div>
      <div id="disconnect-link">Disconnect</div>
    </div>
  </header>

  <div id="not-connected">
    Not connected yet.<br /><br />Click the Neurovance icon in your toolbar to pair this browser.
  </div>

  <div id="messages">
    <div id="empty-state">Ask it to look something up, open a page, or act on the tab you're on.</div>
  </div>

  <div id="composer">
    <textarea id="input" placeholder="Message your Superself…" rows="1"></textarea>
    <button id="send-btn">&#8593;</button>
  </div>
</div>
<script src="sidepanel.js"></script>
</body>
</html>
